<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stajnia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Stajnia Słówek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen phone app; pasture-green world, hay-coloured stalls with barn-door arches, barn red for actions */
  --pasture:#2f6b4a; --pasture-deep:#234f38; --hay:#f6e7b4; --hay-deep:#e6cf86;
  --barn:#b3312b; --barn-deep:#8a231f; --wood:#5b3a24; --ink:#2b1d14; --paper:#fffaf0;
  --ok:#2e8b57; --bad:#c0392b; --carrot:#ef7d22;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--pasture);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--pasture)}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--pasture-deep);color:var(--paper)}
.top h1{font-size:22px;flex:1;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:99px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.gear{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--paper);font-size:18px}
.lvl{padding:8px 16px 10px;background:var(--pasture-deep);color:var(--paper);font-size:13px;font-weight:700}
.lvl .row{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#ffd54a;transition:width .4s}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
main>*,.pbody>*{flex-shrink:0}
.pbody>.btn{flex:none}
.tabs{display:flex;background:var(--wood);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;color:#e9d9b8;font-family:var(--display);font-weight:600;font-size:15px;padding:8px 4px;border-radius:12px}
.tabs button[aria-current="true"]{background:var(--hay);color:var(--ink)}
.daily{background:var(--pasture-deep);color:var(--paper);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.daily .row{display:flex;justify-content:space-between;gap:8px}
/* stall */
.stall{background:var(--hay);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.arch{position:relative;background:linear-gradient(#8b5a36,#6e4429);border-radius:120px 120px 0 0/90px 90px 0 0;margin:12px 12px 0;padding:14px 10px 0;text-align:center;border:6px solid var(--wood);border-bottom:0}
.arch svg{width:74%;max-width:240px;height:auto;display:block;margin:0 auto}
.arch.foal svg{width:52%}
.plate{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--wood);border-radius:8px;padding:0 10px;font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap}
.shine{position:absolute;right:16px;top:14px;font-size:13px;font-weight:800;background:#ffd54a;border-radius:99px;padding:2px 8px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sec{font-weight:800;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.meter{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:700}
.meter .bar{background:var(--hay-deep)}
.meter .bar i{background:var(--ok)}
.meter.low .bar i{background:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--barn);color:#fff;border-radius:14px;padding:10px 14px;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--barn-deep);flex:1;min-width:92px;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--barn-deep)}
.acts.g2{display:grid;grid-template-columns:1fr 1fr}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--hay-deep)}
.btn.go{background:var(--ok);box-shadow:0 3px 0 #1f6a40}
.btn[disabled]{opacity:.45}
.btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.locked{background:rgba(0,0,0,.22);color:var(--paper);border:3px dashed rgba(255,255,255,.4);border-radius:20px;padding:18px;text-align:center;font-weight:700}
.locked h3{font-size:19px;margin-bottom:4px}
.card{background:var(--hay);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card h3{font-size:20px}
.card.off{opacity:.6}
.small{font-size:13px;font-weight:700;opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--paper);border:2px solid var(--hay-deep);border-radius:99px;padding:6px 12px;font-weight:800;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--wood);color:var(--paper);border-color:var(--wood)}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.path li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-weight:700;font-size:14px}
.path b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hay-deep);font-family:var(--display)}
.path li.done b{background:var(--ok);color:#fff}
.path li.next b{background:#ffd54a}
.shop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-weight:700;padding:6px 0;border-top:2px solid var(--hay-deep)}
.shop .btn{flex:none;min-width:104px;font-size:14px;padding:8px 10px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--wood)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--barn)}
/* play */
#play{position:fixed;inset:0;background:var(--pasture);z-index:20;display:flex;justify-content:center}
#play[hidden],#modal[hidden]{display:none}
.pwrap{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;color:var(--paper);font-weight:800}
.ptop .bar{flex:1}
.quit{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);color:var(--paper);font-size:18px;font-weight:800}
.track{margin:0 16px;background:#c9a56b;border-radius:14px;padding:4px 0;border:4px solid var(--wood)}
.lane{position:relative;height:40px;border-bottom:2px dashed rgba(255,255,255,.5)}
.lane:last-child{border-bottom:0}
.lane .runner{position:absolute;top:2px;width:54px;transition:left .35s linear}
.lane .runner svg{width:54px;height:auto;display:block}
.lane .who{position:absolute;right:26px;top:11px;font-size:11px;font-weight:800;color:rgba(43,29,20,.6)}
.lane.me{background:rgba(255,213,74,.45)}
.track::after{content:"";position:absolute}
.finish{position:absolute;right:16px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(#fff 0 6px,#2b1d14 6px 12px)}
.pbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.q{background:var(--paper);border-radius:20px;padding:20px 16px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.q .hint{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.6;margin-bottom:6px}
.q .word{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.15;overflow-wrap:anywhere}
.q .note{font-weight:700;opacity:.7;margin-top:4px}
.say{margin-top:10px;background:var(--hay);border-radius:99px;padding:8px 16px;font-weight:800;min-height:40px}
.opts{display:grid;gap:10px}
.opt{background:var(--hay);border-radius:16px;padding:14px;font-weight:800;font-size:18px;text-align:center;box-shadow:0 3px 0 var(--hay-deep);min-height:52px;overflow-wrap:anywhere}
.opt.right{background:var(--ok);color:#fff;box-shadow:none}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:48px}
.slot{min-width:36px;height:44px;border-radius:10px;background:var(--paper);border:2px solid var(--hay-deep);font-family:var(--display);font-weight:800;font-size:22px;display:grid;place-items:center;padding:0 8px}
.slot.fix{background:none;border:0;min-width:14px;color:var(--paper)}
.slot.w{font-size:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:44px;height:48px;border-radius:12px;background:var(--hay);box-shadow:0 3px 0 var(--hay-deep);font-family:var(--display);font-weight:800;font-size:22px;padding:0 10px}
.tile.w{font-size:18px}
.tile.used{visibility:hidden}
.type{width:100%;font:800 22px var(--body);padding:14px;border-radius:14px;border:3px solid var(--hay-deep);text-align:center;background:var(--paper);color:var(--ink)}
.fb{border-radius:16px;padding:12px 14px;font-weight:800;text-align:center}
.fb.ok{background:#d7f2e0;color:#17532f}
.fb.no{background:#fde0db;color:#7d1d14}
.fb .ans{font-family:var(--display);font-size:22px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{background:var(--hay);border-radius:14px;padding:12px 8px;font-weight:800;min-height:56px;box-shadow:0 3px 0 var(--hay-deep);overflow-wrap:anywhere}
.pair.sel{background:#ffd54a}
.pair.gone{visibility:hidden}
.pair.miss{background:var(--bad);color:#fff}
.sum{background:var(--paper);border-radius:20px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.sum h2{font-size:28px}
.sum .big{font-family:var(--display);font-weight:800;font-size:44px;color:var(--barn)}
.sum svg{width:60%;max-width:200px;margin:0 auto}
.up{background:#ffd54a;border-radius:14px;padding:10px;font-weight:800}
.hearts{letter-spacing:4px;font-size:18px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,30,24,.7);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--paper);border-radius:20px;padding:18px;width:100%;max-width:480px;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:24px}
.sheet h3{font-size:17px;margin-top:6px}
.sheet label{display:flex;gap:10px;align-items:center;font-weight:700;padding:6px 0}
.sheet input[type=checkbox]{width:22px;height:22px;accent-color:var(--barn);flex:none}
.sheet input[type=text],.sheet input[type=password]{font:700 17px var(--body);padding:10px;border-radius:10px;border:2px solid var(--hay-deep);width:100%;background:#fff;color:var(--ink)}
.sheet .rowf{display:flex;gap:8px;flex-wrap:wrap}
.sheet .rowf input{flex:1;min-width:120px}
.sheet ul{margin:0;padding-left:18px;font-weight:700;font-size:14px}
.sheet .stat{margin-left:auto;font-size:13px;opacity:.7;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:800;z-index:40;max-width:90%;text-align:center}
#toast[hidden]{display:none}
#login{position:fixed;inset:0;z-index:50;background:var(--pasture);display:grid;place-items:center;padding:16px;overflow-y:auto}
#login[hidden]{display:none}
#login form{background:var(--paper);border-radius:20px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#login h2{font-size:30px;text-align:center}
#login svg{width:60%;margin:0 auto;display:block}
#login label{font-weight:800;font-size:14px;display:flex;flex-direction:column;gap:4px}
#login input{font:700 18px var(--body);padding:12px;border-radius:12px;border:2px solid var(--hay-deep);background:#fff;color:var(--ink)}
#login .msg{color:var(--bad);font-weight:800;min-height:20px;text-align:center}
#login .link{font-weight:700;text-decoration:underline;font-size:14px;padding:8px}
/* horse motion */
.run .leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .36s infinite alternate ease-in-out}
.run .leg.b{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.idle .tail{transform-box:fill-box;transform-origin:100% 0;animation:tail 2.4s infinite alternate ease-in-out}
@keyframes tail{to{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

 siwy:{n:'Arab siwy',b:'#dcd8d0',m:'#8d8a86',rare:1},kary:{n:'Fryz kary',b:'#2f2926',m:'#0f0d0c',rare:1},izabel:{n:'Izabelowaty',b:'#e6c47e',m:'#fff4d6',rare:1}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- pytania ---------- */
const norm=s=>String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\.\.\./g,'').replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim();
function pool(){let a=[];allSections().forEach(s=>a=a.concat(wordsOf(s)));return a;}
function distract(w,field){const all=pool().filter(x=>x.id!==w.id&&x.pl!==w.pl&&norm(x.en)!==norm(w.en)&&x.phrase===w.phrase);
 const c=shuffle(all.filter(x=>x.sec===w.sec)).concat(shuffle(all.filter(x=>x.sec!==w.sec))),out=[];
 for(const x of c){if(out.length>=3)break;if(!out.find(o=>o[field]===x[field]))out.push(x);}return out;}
function kindFor(w,m){
 if(m<=0)return 'mc_en_pl';if(m===1)return 'mc_pl_en';if(m===2)return canSpeak?'listen':'mc_en_pl';
 if(w.phrase)return w.ord?'order':(m%2?'mc_pl_en':'mc_en_pl');
 if(m===3)return 'tiles';if(m>=5)return shuffle(canSpeak?['type','tiles','listen']:['type','tiles'])[0];return 'type';}
function makeQ(w,kind){const q={w,kind,done:false};
 if(kind==='mc_en_pl'||kind==='listen'){q.opts=shuffle([w].concat(distract(w,'pl')));q.label=x=>x.pl;}
 else if(kind==='mc_pl_en'){q.opts=shuffle([w].concat(distract(w,'en')));q.label=x=>x.en;}
 else if(kind==='tiles'){q.target=norm(w.en);q.slots=q.target.split('').map(c=>/[a-z]/.test(c)?null:c);const L=q.target.replace(/[^a-z]/g,'').split('');const extra=shuffle('aeiorstln'.split('')).slice(0,2);q.tiles=shuffle(L.concat(extra)).map(c=>({c,used:false}));q.fill=[];}
 else if(kind==='order'){q.tok=w.ord.split(' ');let t=shuffle(q.tok);if(t.join(' ')===w.ord&&t.length>1)t=t.reverse();q.tiles=t.map(c=>({c,used:false}));q.line=[];}
 return q;}
function pickWords(sec,n){const now=Date.now(),w=shuffle(wordsOf(sec)).sort((a,b)=>{const ra=S.words[a.id]||{m:0,due:0},rb=S.words[b.id]||{m:0,due:0};return ((ra.due<=now?0:1)-(rb.due<=now?0:1))||(ra.m-rb.m);});
 if(!w.length)return [];const out=[];while(out.length<Math.min(n,w.length*3))out.push(w[out.length%w.length]);return out;}
function writeKind(w){return w.phrase?(w.ord?'order':'mc_pl_en'):'type';}
function secById(id){return allSections().find(s=>s.id===id);}

/* ---------- sesje ---------- */
function startRound(mode,secId){const sec=secById(secId),ho=horse(sec);
 if(mode==='feed'&&energy(ho)>=100){toast(ho.name+' jest najedzony.');return;}
 const q=pickWords(sec,mode==='feed'?5:8);if(!q.length){toast('Ten koń nie ma jeszcze słówek.');return;}
 sess={mode,sec,ho,queue:q,i:0,ok:0,bad:0,retried:{},gain:{c:0,x:0}};openPlay();nextQ();}
function startObst(){const w=shuffle(pool().filter(x=>unlocked().find(s=>s.id===x.sec)&&(S.words[x.id]||{m:0}).m>=2&&(!x.phrase||x.ord)));
 if(w.length<4){toast('Najpierw potrenuj. Potrzebujesz 4 słówek na poziomie 2 lub wyżej.');return;}
 const q=[];while(q.length<8)q.push(w[q.length%w.length]);sess={mode:'obst',queue:q,i:0,ok:0,bad:0,lives:3,retried:{},gain:{c:0,x:0}};openPlay();nextQ();}
function startRace(id){const r=RACES[id],sec=secById(pickedHorse),ho=horse(sec);
 if(energy(ho)<30){toast(ho.name+' jest zbyt głodny na wyścig. Najpierw go nakarm.');return;}
 const w=pool().filter(x=>unlocked().find(s=>s.id===x.sec)&&(S.words[x.id]||{}).seen);
 if(w.length<4){toast('Najpierw potrenuj. Potrzebujesz co najmniej 4 poznanych słówek.');return;}
 setEnergy(ho,energy(ho)-30);save();
 const names=shuffle(['Błyskawica','Grom','Mgiełka','Kometa','Zefir']),coats=shuffle(Object.keys(COATS));
 sess={mode:'race',race:r,sec,ho,words:w,ok:0,bad:0,pos:Math.round(mastery(sec).avg)*.03,start:0,riv:r.t.map((t,i)=>({t,name:names[i],coat:coats[i],pos:0})),gain:{c:0,x:0},last:null};
 openPlay();sess.start=performance.now();raf=requestAnimationFrame(tick);nextQ();}
function tick(now){if(!sess||sess.mode!=='race'||sess.over)return;const el=(now-sess.start)/1000;sess.riv.forEach(r=>r.pos=Math.min(1,el/r.t));drawTrack();
 if(sess.riv.every(r=>r.pos>=1)){finishRace();return;}raf=requestAnimationFrame(tick);}
function drawTrack(){const set=(id,p)=>{const e=document.getElementById(id);if(e)e.style.left='calc('+(p*100)+'% - '+(p*76)+'px)';};set('rn-me',Math.min(sess.pos,1));sess.riv.forEach((r,i)=>set('rn-'+i,r.pos));}
function openPlay(){const p=$('#play');p.hidden=false;
 p.innerHTML=`<div class="pwrap"><div class="ptop"><button class="quit" data-act="quit" aria-label="Zakończ">✕</button><div class="bar"><i id="pbar"></i></div><span id="pinfo"></span></div>${sess.mode==='race'?`<div class="track" style="position:relative"><div class="finish"></div><div class="lane me"><span class="who">${esc(sess.ho.name)}</span><div class="runner" id="rn-me" style="left:0">${horseSVG(sess.ho,'run')}</div></div>${sess.riv.map((r,i)=>`<div class="lane"><span class="who">${r.name}</span><div class="runner" id="rn-${i}" style="left:0">${horseSVG({coat:r.coat,name:r.name},'run')}</div></div>`).join('')}</div>`:''}<div class="pbody" id="pbody"></div></div>`;}
function closePlay(){cancelAnimationFrame(raf);sess=null;$('#play').hidden=true;try{if(canSpeak)speechSynthesis.cancel();}catch(e){}save();render();}
function header(){const b=$('#pbar'),i=$('#pinfo');if(!b)return;
 if(sess.mode==='race'){b.style.width=Math.min(sess.pos,1)*100+'%';i.textContent=sess.ok+' / 12';}
 else{b.style.width=sess.i/sess.queue.length*100+'%';i.innerHTML=sess.mode==='obst'?'<span class="hearts">'+'♥'.repeat(sess.lives)+'</span>':(sess.i+1>sess.queue.length?sess.queue.length:sess.i+1)+' / '+sess.queue.length;}}
function nextQ(){
 if(sess.mode==='race'){let w;do{w=sess.words[Math.floor(Math.random()*sess.words.length)];}while(sess.words.length>1&&w===sess.last);sess.last=w;
  const k=sess.race.id===0?(Math.random()<.5?'mc_en_pl':'mc_pl_en'):(sess.race.id===1&&canSpeak&&Math.random()<.4?'listen':'mc_pl_en');sess.q=makeQ(w,k);header();drawQ();return;}
 if(sess.i>=sess.queue.length||(sess.mode==='obst'&&sess.lives<=0)){finishRound();return;}
 const w=sess.queue[sess.i],r=rec(w);header();
 if((sess.mode==='train'||sess.mode==='write')&&!r.seen){r.seen=1;drawIntro(w);return;}
 sess.q=makeQ(w,sess.mode==='obst'||sess.mode==='write'?writeKind(w):kindFor(w,r.m));drawQ();}
function drawIntro(w){$('#pbody').innerHTML=`<div class="q"><p class="hint">Nowe słówko</p><p class="word">${esc(w.en)}</p>${w.note?`<p class="note">${esc(w.note)}</p>`:''}<p class="note" style="font-size:20px;opacity:1">${esc(w.pl)}${w.plNote?' ('+esc(w.plNote)+')':''}</p>${canSpeak?'<button class="say" data-act="say">Posłuchaj</button>':''}</div><button class="btn go" data-act="introok">Rozumiem, dalej</button>`;sess.q={w,kind:'intro'};speak(w.say);}
function drawQ(){const q=sess.q,w=q.w,k=q.kind,pl=esc(w.pl)+(w.plNote?' <span class="note">('+esc(w.plNote)+')</span>':'');let h='';
 if(k==='mc_en_pl')h=`<div class="q"><p class="hint">Co to znaczy?</p><p class="word">${esc(w.en)}</p>${w.note?`<p class="note">${esc(w.note)}</p>`:''}${canSpeak?'<button class="say" data-act="say">Posłuchaj</button>':''}</div>`;
 else if(k==='listen')h=`<div class="q"><p class="hint">Posłuchaj i wybierz znaczenie</p><button class="say" data-act="say" style="font-size:20px;padding:14px 24px">Odtwórz jeszcze raz</button></div>`;
 else if(k==='mc_pl_en')h=`<div class="q"><p class="hint">Jak to będzie po angielsku?</p><p class="word">${pl}</p></div>`;
 else if(k==='tiles')h=`<div class="q"><p class="hint">Ułóż słówko z liter</p><p class="word">${pl}</p></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;
 else if(k==='order')h=`<div class="q"><p class="hint">Ułóż zdanie</p><p class="word" style="font-size:24px">${pl}</p></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;
 else if(k==='type')h=`<div class="q"><p class="hint">Napisz po angielsku</p><p class="word">${pl}</p></div><input class="type" id="typed" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Twoja odpowiedź"><button class="btn go" data-act="check">Sprawdź</button>`;
 if(q.opts)h+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${esc(q.label(o))}</button>`).join('')}</div>`;
 h+='<div id="fb"></div>';$('#pbody').innerHTML=h;
 if(k==='tiles'||k==='order')drawTiles();
 if(k==='type'){const t=$('#typed');t.addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped();});if(sess.mode!=='race')try{t.focus();}catch(e){}}
 if(k==='listen'||(k==='mc_en_pl'&&sess.mode!=='race'))speak(w.say);}
function drawTiles(){const q=sess.q,ord=q.kind==='order';
 if(ord){$('#slots').innerHTML=q.line.length?q.line.map((ti,i)=>`<button class="slot w" data-act="unslot" data-i="${i}">${esc(q.tiles[ti].c)}</button>`).join(''):'<span class="slot fix">…</span>';}
 else{let fi=0;$('#slots').innerHTML=q.slots.map(c=>{if(c!==null)return `<span class="slot fix">${c===' '?'&nbsp;':esc(c)}</span>`;const ti=q.fill[fi],i=fi++;return ti===undefined?'<span class="slot"></span>':`<button class="slot" data-act="unslot" data-i="${i}">${q.tiles[ti].c}</button>`;}).join('');}
 $('#tiles').innerHTML=q.tiles.map((t,i)=>`<button class="tile${ord?' w':''}${t.used?' used':''}" data-act="tile" data-i="${i}">${esc(t.c)}</button>`).join('');}
function tapTile(i){const q=sess.q;if(q.done||q.tiles[i].used)return;const ord=q.kind==='order',arr=ord?q.line:q.fill,need=ord?q.tok.length:q.target.replace(/[^a-z]/g,'').length;if(arr.length>=need)return;
 q.tiles[i].used=true;arr.push(i);drawTiles();
 if(arr.length===need){const got=arr.map(t=>q.tiles[t].c).join(ord?' ':'');const ok=ord?got===q.w.ord:accept(q.w,got,true);resolve(ok);}}
function untile(i){const q=sess.q;if(q.done)return;const arr=q.kind==='order'?q.line:q.fill;const ti=arr.splice(i,1)[0];if(ti!==undefined)q.tiles[ti].used=false;drawTiles();}
function accept(w,val,lettersOnly){const f=s=>lettersOnly?norm(s).replace(/[^a-z]/g,''):norm(s);const v=f(val);return pool().some(x=>x.pl===w.pl&&f(x.en)===v);}
function checkTyped(){const q=sess.q;if(q.done)return;const v=$('#typed').value;if(!norm(v))return;resolve(accept(q.w,v,false));}
function resolve(ok,btn){const q=sess.q,w=q.w,r=rec(w);if(q.done)return;q.done=true;r.seen=1;
 if(q.opts)document.querySelectorAll('#pbody .opt').forEach((b,i)=>{if(q.opts[i].id===w.id||q.opts[i].pl===w.pl&&q.kind!=='mc_pl_en')b.classList.add('right');else if(b===btn)b.classList.add('wrong');b.disabled=true;});
 const race=sess.mode==='race';
 if(ok){const pay=sess.mode==='write'?2:1;sess.ok++;S.carrots+=pay;sess.gain.c+=pay;addXP(1);sess.gain.x++;countCorrect();
  if(!race){r.m=Math.min(5,r.m+1);r.due=Date.now()+INT[r.m];}
  if(sess.mode==='feed')setEnergy(sess.ho,energy(sess.ho)+20);
  if(race){sess.pos+=1/12;drawTrack();}
 }else{sess.bad++;r.wrong++;
  if(!race){r.m=Math.max(0,r.m-1);r.due=Date.now();}
  if(sess.mode==='obst')sess.lives--;
  if((sess.mode==='train'||sess.mode==='write')&&!sess.retried[w.id]){sess.retried[w.id]=1;sess.queue.push(w);}}
 save();header();
 const fb=$('#fb');
 if(ok){fb.innerHTML=`<div class="fb ok">${sess.mode==='feed'?'Mniam! +20% energii':sess.mode==='obst'?'Czysty skok!':sess.mode==='write'?'Dobrze! +2 marchewki':'Dobrze! +1 marchewka'}</div>`;}
 else{fb.innerHTML=`<div class="fb no">${sess.mode==='obst'?'Strącona poprzeczka. ':''}Poprawnie: <div class="ans">${esc(w.en)}</div>${esc(w.pl)}${race?'':'<div style="margin-top:10px"><button class="btn" data-act="next">Dalej</button></div>'}</div>`;if(!race&&q.kind!=='listen')speak(w.say);}
 if(race){if(sess.pos>=1-1e-9){setTimeout(finishRace,500);return;}setTimeout(()=>{if(sess&&!sess.over)nextQ();},ok?450:1700);}
 else if(ok)setTimeout(()=>{if(sess&&sess.q===q)advance();},750);
 fb.scrollIntoView({block:'nearest'});}
function advance(){sess.i++;nextQ();}
function ups(){return (sess.ups||[]).map(u=>`<div class="up">Nowy poziom: ${u.n}!<br><span class="small">${u.u}</span></div>`).join('');}
function finishRound(){const total=sess.ok+sess.bad;let title,extra='';
 if(sess.mode==='obst'){const clean=sess.lives===3&&sess.ok>=8;S.carrots+=sess.ok+(clean?10:0);sess.gain.c+=sess.ok+(clean?10:0);if(sess.ok>S.trophy.obst)S.trophy.obst=Math.min(8,sess.ok);title=sess.lives<=0?'Koniec przejazdu':clean?'Czysty przejazd!':'Przejazd ukończony';extra=`<p class="big">${sess.ok} / 8</p><p>przeszkód pokonanych</p>`;}
 else{const flawless=sess.bad===0;if(flawless){S.carrots+=3;sess.gain.c+=3;addXP(3);sess.gain.x+=3;}
  title=sess.mode==='feed'?sess.ho.name+' nakarmiony':sess.mode==='write'?(flawless?'Pisanie bez błędu!':'Pisanie ukończone'):flawless?'Trening bez błędu!':'Trening ukończony';
  extra=`${horseSVG(sess.ho)}<p class="big">${sess.ok} / ${total}</p><p>${sess.mode==='feed'?'Energia: '+energy(sess.ho)+'%':'dobrych odpowiedzi'}</p>`;}
 save();$('#pbar').style.width='100%';
 $('#pbody').innerHTML=`<div class="sum"><h2>${esc(title)}</h2>${extra}<p><b>+${sess.gain.c} marchewek · +${sess.gain.x} podków</b></p>${ups()}${sess.sec?`<button class="btn go" data-act="again">Jeszcze jedna runda</button>`:''}<button class="btn alt" data-act="quit">Wróć do stajni</button></div>`;}
function finishRace(){if(!sess||sess.over)return;sess.over=true;cancelAnimationFrame(raf);
 const done=sess.pos>=1-1e-9,place=done?1+sess.riv.filter(r=>r.pos>=1).length:4,prize=[15,8,4,1][place-1];
 S.carrots+=prize;sess.gain.c+=prize;if(place===1){S.trophy.g++;addXP(5);sess.gain.x+=5;}else if(place===2)S.trophy.s++;else if(place===3)S.trophy.b++;save();
 const txt=['Złota rozeta!','Srebrna rozeta','Brązowa rozeta','Tym razem bez rozety'][place-1];
 $('#pbody').innerHTML=`<div class="sum"><h2>${esc(sess.race.n)}</h2><p class="big">${place}. miejsce</p><p>${txt}${done?'':' Rywale byli szybsi. Potrenuj i spróbuj jeszcze raz.'}</p><p><b>+${sess.gain.c} marchewek · +${sess.gain.x} podków</b></p><p class="small">Dobre odpowiedzi: ${sess.ok} · potknięcia: ${sess.bad}</p>${ups()}<button class="btn" data-act="quit">Wróć do stajni</button></div>`;}

/* ---------- czesanie (dopasowywanie par) ---------- */
function startGroom(secId){const sec=secById(secId),ho=horse(sec),ws=[];for(const w of shuffle(wordsOf(sec))){if(ws.length>=5)break;if(!ws.find(x=>x.pl===w.pl))ws.push(w);}
 if(ws.length<2){toast('Za mało słówek do dopasowania.');return;}
 sess={mode:'groom',sec,ho,queue:ws,i:0,ok:0,bad:0,gain:{c:0,x:0},L:shuffle(ws),R:shuffle(ws),sel:null,gone:{}};openPlay();drawGroom();}
function drawGroom(){$('#pbar').style.width=sess.ok/sess.queue.length*100+'%';$('#pinfo').textContent=sess.ok+' / '+sess.queue.length;
 let h='<div class="q" style="padding:12px"><p class="hint">Czesanie</p><p style="font-weight:800">Połącz angielskie słówko z polskim</p></div><div class="pairs">';
 for(let i=0;i<sess.L.length;i++){const a=sess.L[i],b=sess.R[i];h+=`<button class="pair${sess.gone[a.id]?' gone':''}${sess.sel===a.id?' sel':''}" data-act="pairL" data-id="${esc(a.id)}">${esc(a.en)}</button><button class="pair${sess.gone[b.id]?' gone':''}" data-act="pairR" data-id="${esc(b.id)}">${esc(b.pl)}</button>`;}
 $('#pbody').innerHTML=h+'</div>';}
function pairR(id,btn){if(!sess.sel)return toast('Najpierw wybierz angielskie słówko.');
 if(sess.sel===id){sess.gone[id]=1;sess.sel=null;sess.ok++;S.carrots++;sess.gain.c++;countCorrect();const w=sess.queue.find(x=>x.id===id);rec(w).seen=1;speak(w.say);
  if(sess.ok===sess.queue.length){addXP(3);sess.gain.x+=3;sess.ho.groomed=today();save();$('#pbar').style.width='100%';
   $('#pbody').innerHTML=`<div class="sum"><h2>${esc(sess.ho.name)} lśni!</h2>${horseSVG(sess.ho)}<p><b>+${sess.gain.c} marchewek · +${sess.gain.x} podków</b></p><p class="small">Pomyłki: ${sess.bad}</p>${ups()}<button class="btn" data-act="quit">Wróć do stajni</button></div>`;return;}
  save();drawGroom();}
 else{sess.bad++;const w=sess.queue.find(x=>x.id===sess.sel);if(w)rec(w).wrong++;btn.classList.add('miss');setTimeout(()=>btn.classList.remove('miss'),450);}}

 modal(`<h2>Panel rodzica</h2><p>${S.pin?'Podaj PIN.':'Ustaw 4-cyfrowy PIN, żeby tylko rodzic mógł zmieniać rozdziały.'}</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="PIN"><p id="pinmsg" class="small"></p><div class="acts"><button class="btn alt" data-act="close">Anuluj</button><button class="btn" data-act="pinok">Dalej</button></div>`);}

/* ---------- zdarzenia ---------- */
const A={
 tab:d=>{tab=d.tab;render();$('#main').scrollTop=0;},
 train:d=>startRound('train',d.sec),write:d=>startRound('write',d.sec),feed:d=>startRound('feed',d.sec),groom:d=>startGroom(d.sec),
 pick:d=>{pickedHorse=d.sec;render();},race:d=>startRace(+d.id),obst:()=>startObst(),
 quit:()=>closePlay(),again:()=>{const m=sess.mode,s=sess.sec.id;startRound(m==='feed'?'train':m,s);},say:()=>speak(sess.q.w.say),introok:()=>{const w=sess.q.w;sess.q=makeQ(w,sess.mode==='write'?writeKind(w):'mc_en_pl');drawQ();},
 opt:(d,b)=>{const q=sess.q;if(q.done)return;const o=q.opts[+d.i];resolve(o.id===q.w.id,b);},
 tile:d=>tapTile(+d.i),unslot:d=>untile(+d.i),check:()=>checkTyped(),next:()=>advance(),
 pairL:d=>{sess.sel=d.id;drawGroom();},pairR:(d,b)=>pairR(d.id,b),
 rename:d=>{const sec=secById(d.sec),ho=horse(sec);modal(`<h2>Imię konia</h2><input id="hname" type="text" maxlength="14" value="${esc(ho.name)}" aria-label="Imię konia"><div class="acts"><button class="btn alt" data-act="close">Anuluj</button><button class="btn" data-act="savename" data-sec="${sec.id}">Zapisz</button></div>`);},
 savename:d=>{const v=$('#hname').value.trim();if(v){horse(secById(d.sec)).name=v.slice(0,14);save();}closeModal();render();},
 shophorse:d=>{shopHorse=d.sec;render();},
 buy:d=>{const it=ITEMS.find(x=>x.id===d.id);if(S.carrots<it.p)return toast('Brakuje '+(it.p-S.carrots)+' marchewek. Zarobisz je na treningu i pisaniu.');S.carrots-=it.p;S.owned.push(it.id);putOn(horse(secById(shopHorse)),it);save();render();},
 wear:d=>{const ho=horse(secById(shopHorse)),i=ho.acc.indexOf(d.id);if(i>=0)ho.acc.splice(i,1);else putOn(ho,ITEMS.find(x=>x.id===d.id));save();render();},
 coat:d=>{if(COATS[d.id].rare&&level()<10)return toast('Rzadkie maści odblokujesz na poziomie 10.');horse(secById(shopHorse)).coat=d.id;save();render();},
 voice:d=>{S.voice=d.name;S.voiceOff=false;save();speak('a bunch of flowers from the florist');parentPanel();},
 guest:()=>{authStore(null);start();},
 logout:()=>{clearTimeout(save.t);const p=AUTH&&S.ts?pushCloud():Promise.resolve();p.then(()=>{authStore(null);showLogin();});},
 parent:()=>parentGate(),pinok:()=>pinOk(),close:()=>{closeModal();render();},
 addword:()=>{const en=$('#cen').value.trim(),pl=$('#cpl').value.trim();if(!en||!pl)return toast('Wpisz słówko po angielsku i po polsku.');if(S.custom.find(c=>norm(c.en)===norm(en)))return toast('To słówko już jest na liście.');S.custom.push({en,pl});S.active.own=true;save();parentPanel();},
 delword:d=>{const c=S.custom.splice(+d.i,1)[0];if(c)delete S.words['own:'+c.en];save();parentPanel();},
 reset1:(d,b)=>{b.textContent='Na pewno? Dotknij jeszcze raz';b.dataset.act='reset2';},
 reset2:()=>{const pin=S.pin,cu=S.custom;S=fresh();S.pin=pin;S.custom=cu;save();closeModal();render();toast('Postępy wyzerowane.');}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b.dataset,b);});
document.addEventListener('change',e=>{const t=e.target;if(!parentOpen)return;if(t.dataset&&t.dataset.sec){S.active[t.dataset.sec]=t.checked;save();}else if(t.id==='unlockall'){S.unlockAll=t.checked;save();}else if(t.id==='voiceoff'){S.voiceOff=t.checked;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin')pinOk();});
if(canSpeak)try{speechSynthesis.getVoices();}catch(e){}
$('#loginform').addEventListener('submit',doLogin);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AUTH&&S&&S.ts){clearTimeout(save.t);pushCloud();}else if(!document.hidden&&AUTH&&S&&!sess)pullCloud();});
try{AUTH=JSON.parse(localStorage.getItem('stajnia-auth')||'null');}catch(e){AUTH=null;}
S=fresh();if(AUTH&&AUTH.uid)start();else{AUTH=null;render();showLogin();}
</script>
</body>
</html>
